name: StructureCraftAuth
main: com.myproject.launcherauth.plugin.AuthPlugin
version: 1.0.0
api-version: "1.21"
author: myproject
description: >-
  Permits only players who logged in via the official launcher
  (verified Supabase JWT via the myproject:auth channel).

commands:
  structurecraftauth:
    description: Manage StructureCraftAuth (reload config)
    usage: /<command> reload
    aliases: [scauth]
    permission: structurecraftauth.reload

permissions:
  structurecraftauth.reload:
    description: Allows reloading the StructureCraftAuth config
    default: op