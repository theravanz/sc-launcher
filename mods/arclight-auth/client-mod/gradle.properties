# ===== SCCAuth Launcher Auth — gradle.properties =====
# Прокси (важно для этой машины): без него загрузка зависимостей недоступна.
org.gradle.jvmargs=-Xmx1G -DsocksProxyHost=127.0.0.1 -DsocksProxyPort=10808
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# JDK 21 (Temurin) для сборки NeoForge 1.21.1. ModDevGradle требует Java 21
# с вендором vendor-specific; Temurin матчится корректно (в отличие от Arch-версии).
org.gradle.java.installations.paths=/home/ravanz/.jdks/jdk-21.0.12.1+1

# Parchment mappings (совпадает с MDK 1.21.1).
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.249
loader_version_range=[1,)

# Идентификатор мода.
mod_id=sccauth
mod_name=StructureCraftCustomAuth 
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.ravanz