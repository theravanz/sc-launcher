# SCCAuth Launcher Auth — неофициальная автономная сборка.
# Формат и поля соответствуют официальному MDK NeoForge 1.21.1 (ModDevGradle).
modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
description='''
Гейтинг-модуль: передаёт Supabase JWT на сервер по каналу sccauth:auth.
'''
# Не указываем credits/authors — достаточно базовых полей.

[[dependencies.${mod_id}]] #optional
modId="neoforge" #mandatory
type="required" #mandatory
versionRange="[${neo_version},)" #mandatory
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]] #optional
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"