// ===== MOD: StructureCraft Custom Menu (NeoForge 1.21.1, ModDevGradle) =====
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
// Специальный тулчейн-конфиг НЕ задаём: сборка идёт JDK, под которым запущен
// Gradle. Запускаем с JAVA_HOME=/usr/lib/jvm/java-21-openjdk, чтобы это была 21.

// Версия NeoForge и Parchment заданы в gradle.properties.
neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Генерируем META-INF/neoforge.mods.toml из шаблона (подстановка ${...}).
def replaceProperties = [
    minecraft_version      : project.minecraft_version,
    minecraft_version_range: project.minecraft_version_range,
    neo_version            : project.neo_version,
    loader_version_range   : project.loader_version_range,
    mod_id                 : project.mod_id,
    mod_name               : project.mod_name,
    mod_license            : project.mod_license,
    mod_version            : project.mod_version,
]
tasks.register('generateModMetadata', Copy) {
    outputs.upToDateWhen { false }
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // кириллица в исходниках
}